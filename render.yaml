services:
  - type: web
    name: buzzhive-test
    runtime: docker
    repo: https://github.com/victor-2026/qa-automation-playwright
    branch: main
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard — Neon PostgreSQL

  - type: web
    name: qa-automation-playwright-front
    runtime: docker
    repo: https://github.com/victor-2026/qa-automation-playwright
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: API_BACKEND_URL
        value: https://buzzhive-test.onrender.com
      - key: API_HOST
        value: buzzhive-test.onrender.com
