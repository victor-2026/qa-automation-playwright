name: Uptime Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate URLs
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "::error::BACKEND_URL not set in repo variables. Set it in Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "BACKEND_URL=${{ vars.BACKEND_URL }}"

      - name: Wake Render backend (cold start)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          echo "Waking $BACKEND_URL ..."
          curl -s -o /dev/null --max-time 60 "$BACKEND_URL" || true
          echo "Wake done (cold start may take 30-60s on free tier)"

      - name: Ping Render health endpoint
        id: health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          echo "Checking $BACKEND_URL/api/health ..."

          for i in {1..5}; do
            RESPONSE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BACKEND_URL/api/health")
            if [ "$RESPONSE" = "200" ]; then
              echo "HTTP Status: $RESPONSE"
              echo "status=$RESPONSE" >> $GITHUB_OUTPUT
              BODY=$(cat /tmp/health.json)
              echo "Response: $BODY"
              echo "$BODY" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("status")=="healthy" and d.get("database")=="connected"' && echo "Backend healthy, database connected" || { echo "Health payload validation failed"; exit 1; }
              exit 0
            fi
            echo "Waiting for backend... ($i/5) status=$RESPONSE"
            sleep 10
          done

          echo "❌ Health check failed after 5 retries"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Check history on failure
        if: failure()
        run: |
          echo "❌ Uptime check failed at $(date -u)"
          echo "Check Render dashboard: https://dashboard.render.com"
