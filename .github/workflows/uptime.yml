name: Uptime Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate URLs
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "::error::BACKEND_URL not set in repo variables. Set it in Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "BACKEND_URL=${{ vars.BACKEND_URL }}"

      - name: Wake Render backend (cold start)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          echo "Waking $BACKEND_URL ..."
          curl -s -o /dev/null --max-time 90 "$BACKEND_URL" || true
          echo "Wake done (cold start may take 30-90s on free tier)"

      - name: Ping Render health endpoint
        id: health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          echo "Checking $BACKEND_URL/api/health ..."

          for i in 1 2 3 4 5 6 7 8; do
            RESPONSE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BACKEND_URL/api/health")
            if [ "$RESPONSE" = "200" ]; then
              echo "HTTP Status: $RESPONSE"
              echo "status=$RESPONSE" >> $GITHUB_OUTPUT
              BODY=$(cat /tmp/health.json)
              echo "Response: $BODY"
              echo "$BODY" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("status")=="healthy" and d.get("database")=="connected"' && echo "Backend healthy, database connected" || { echo "Health payload validation failed"; exit 1; }
              exit 0
            fi
            if [ "$i" -le 3 ]; then
              SLEEP=$((i * 10))
            else
              SLEEP=40
            fi
            echo "Waiting for backend... ($i/8) status=$RESPONSE — sleeping ${SLEEP}s"
            sleep $SLEEP
          done

          echo "❌ Health check failed after 8 retries"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Check frontend
        id: frontend
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://$FRONTEND_URL" || echo "000")
          echo "Frontend HTTP: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Record uptime metric
        if: always()
        env:
          BACKEND_STATUS: ${{ steps.health.outcome }}
          FRONTEND_STATUS: ${{ steps.frontend.outputs.status }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TIME=$(date -u +%H:%M)
          BACKEND_OK=$( [ "$BACKEND_STATUS" = "success" ] && echo "up" || echo "down" )
          FRONTEND_OK=$( [ "$FRONTEND_STATUS" = "200" ] && echo "up" || echo "down" )

          python3 -c "
          import json, os
          f = 'monitoring/metrics/uptime.json'
          data = []
          if os.path.exists(f):
              with open(f) as fh:
                  data = json.load(fh)

          # Update or append today's entry
          entry = {'date': '$DATE', 'time': '$TIME', 'backend_status': '$BACKEND_OK', 'frontend_status': '$FRONTEND_OK'}
          updated = False
          for i, row in enumerate(data):
              if row.get('date') == '$DATE':
                  data[i] = entry
                  updated = True
                  break
          if not updated:
              data.append(entry)

          # Keep last 90 days
          data = data[-90:]

          with open(f, 'w') as fh:
              json.dump(data, fh, indent=2)
              fh.write('\n')
          print(f'Recorded: backend=$BACKEND_OK frontend=$FRONTEND_OK')
          "

      - name: Commit metrics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitoring/metrics/uptime.json
          git diff --cached --quiet || git commit -m "metrics: uptime $(date -u +%Y-%m-%d) [skip ci]" && git push || echo "No changes to commit"

      - name: Check history on failure
        if: failure()
        run: |
          echo "❌ Uptime check failed at $(date -u)"
          echo "Check Render dashboard: https://dashboard.render.com"
