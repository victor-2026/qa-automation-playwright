name: Nightly Full Suite

on:
  schedule:
    # Every night at 3 AM UTC (10 AM Moscow)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v5

      - name: Validate URLs
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "::error::BACKEND_URL not set in repo variables. Set it in Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "BACKEND_URL=${{ vars.BACKEND_URL }}"
          if [ -n "${{ vars.FRONTEND_URL }}" ]; then
            echo "FRONTEND_URL=${{ vars.FRONTEND_URL }}"
          else
            echo "FRONTEND_URL not set — UI smoke tests will be skipped"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Wake Render backend (cold start)
        run: |
          BACKEND_URL="${{ vars.BACKEND_URL }}"
          echo "Waking $BACKEND_URL ..."
          curl -s -o /dev/null --max-time 60 "$BACKEND_URL" || true
          echo "Wake done (cold start may take 30-60s on free tier)"

      - name: Check Render backend
        id: check-backend
        run: |
          BACKEND_URL="${{ vars.BACKEND_URL }}"
          echo "Testing backend at: $BACKEND_URL"
          
          for i in {1..5}; do
            if curl -s --max-time 30 "$BACKEND_URL/api/health" | grep -q "healthy"; then
              echo "Backend is healthy"
              echo "BACKEND_AVAILABLE=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Waiting for backend... ($i/5)"
            sleep 10
          done
          echo "Backend not available"
          echo "BACKEND_AVAILABLE=false" >> $GITHUB_OUTPUT

      - name: Seed database
        if: steps.check-backend.outputs.BACKEND_AVAILABLE == 'true'
        id: seed
        run: |
          BACKEND_URL="${{ vars.BACKEND_URL }}"
          echo "Seeding database..."
          RESPONSE=$(curl -s -X POST "$BACKEND_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@buzzhive.com","password":"admin123"}')
          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null | tr -d '\n')
          
          if [ -z "$TOKEN" ]; then
            echo "::warning::Failed to obtain admin token — backend may be down"
            echo "TOKEN_VALID=false" >> $GITHUB_OUTPUT
          else
            echo "Token obtained successfully"
            echo "token=$TOKEN" >> $GITHUB_OUTPUT
            echo "TOKEN_VALID=true" >> $GITHUB_OUTPUT
            curl -s -X POST "$BACKEND_URL/api/reset" -H "Authorization: Bearer $TOKEN"
            echo "Database seeded"
          fi

      - name: API Smoke Tests
        if: steps.check-backend.outputs.BACKEND_AVAILABLE == 'true' && steps.seed.outputs.TOKEN_VALID == 'true'
        env:
          APP_BASE_URL: ${{ vars.BACKEND_URL }}
          API_BASE_URL: ${{ vars.BACKEND_URL }}/api
          TEST_USERNAME: alice@buzzhive.com
          TEST_PASSWORD: alice123
          TEST_ADMIN_EMAIL: admin@buzzhive.com
          TEST_ADMIN_PASSWORD: admin123
          TEST_MOD_EMAIL: mod@buzzhive.com
          TEST_MOD_PASSWORD: mod123
          TEST_BOB_EMAIL: bob@buzzhive.com
          TEST_BOB_PASSWORD: bob123
        run: npx playwright test e2e/api/smoke-api.spec.ts --project=chromium --retries=2

      - name: Wake Render frontend (cold start)
        if: steps.check-backend.outputs.BACKEND_AVAILABLE == 'true' && steps.seed.outputs.TOKEN_VALID == 'true' && vars.FRONTEND_URL != ''
        run: |
          FRONTEND_URL="${{ vars.FRONTEND_URL }}"
          echo "Waking $FRONTEND_URL ..."
          curl -s -o /dev/null --max-time 60 "$FRONTEND_URL" || true
          echo "Wake done (cold start may take 30-60s on free tier)"

      - name: Check Render frontend
        if: steps.check-backend.outputs.BACKEND_AVAILABLE == 'true' && steps.seed.outputs.TOKEN_VALID == 'true' && vars.FRONTEND_URL != ''
        id: check-frontend
        run: |
          FRONTEND_URL="${{ vars.FRONTEND_URL }}"
          
          if [ -z "$FRONTEND_URL" ]; then
            echo "FRONTEND_URL is not set — skipping frontend check"
            echo "FRONTEND_AVAILABLE=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$FRONTEND_URL" || echo "000")
            if [ "$STATUS" != "000" ] && [ "$STATUS" -lt 500 ]; then
              echo "Frontend is up (HTTP $STATUS)"
              echo "FRONTEND_AVAILABLE=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Waiting for frontend... ($i/5, HTTP $STATUS)"
            sleep 10
          done
          echo "Frontend not available"
          echo "FRONTEND_AVAILABLE=false" >> $GITHUB_OUTPUT

      - name: UI Smoke Tests
        if: steps.check-frontend.outputs.FRONTEND_AVAILABLE == 'true'
        env:
          APP_BASE_URL: ${{ vars.FRONTEND_URL }}
          API_BASE_URL: ${{ vars.BACKEND_URL }}/api
          TEST_USERNAME: alice@buzzhive.com
          TEST_PASSWORD: alice123
        run: npx playwright test e2e/ui/smoke-ui.spec.ts --project=chromium --retries=2

      - name: Report status
        if: always()
        run: |
          echo "Backend available: ${{ steps.check-backend.outputs.BACKEND_AVAILABLE }}"
          echo "Token valid: ${{ steps.seed.outputs.TOKEN_VALID }}"
          echo "Frontend available: ${{ steps.check-frontend.outputs.FRONTEND_AVAILABLE }}"
          if [ "${{ steps.check-backend.outputs.BACKEND_AVAILABLE }}" != "true" ]; then
            echo "::warning::Backend was not available — tests skipped"
          fi
          if [ "${{ steps.check-frontend.outputs.FRONTEND_AVAILABLE }}" != "true" ] && [ "${{ steps.check-backend.outputs.BACKEND_AVAILABLE }}" == "true" ]; then
            echo "::warning::Frontend was not available — UI tests skipped"
          fi

