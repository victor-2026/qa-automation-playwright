# Smoke API tests on Render (daily 06:00 UTC)
# Local Allure report uploaded as artifact
# See: docs/ALLURE_TESTOPS_ACTIVATION.md

name: allure-testops

on:
  workflow_dispatch:  # Manual trigger (for ad-hoc runs)
  schedule:
    - cron: '0 6 * * *'  # Daily 06:00 UTC

env:
  ALLURE_RESULTS: "allure-results"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        run: npx playwright test e2e/api/ --project=chromium
        env:
          API_BASE_URL: ${{ vars.BACKEND_URL }}/api
          APP_BASE_URL: ${{ vars.FRONTEND_URL }}

      - name: Generate local Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload local Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-local
          path: allure-report/

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
