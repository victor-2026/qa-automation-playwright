# Allure TestOps integration (ACTIVATED 2026-06-16)
# Trial: https://victor2026.testops.cloud — Project ID 2 = qa-automation-sandbox
# See: wiki/allure-testops-research-2026.md
# See: docs/ALLURE_TESTOPS_ACTIVATION.md

name: allure-testops

on:
  workflow_dispatch:  # Manual trigger (for ad-hoc runs)
  schedule:
    - cron: '0 6 * * *'  # Daily 06:00 UTC

env:
  ALLURE_RESULTS: "allure-results"
  ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
  ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ secrets.ALLURE_ENDPOINT }}
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: ${{ secrets.ALLURE_PROJECT_ID }}

      - name: Run smoke tests with Allure TestOps upload
        run: |
          allurectl watch -- npx playwright test e2e/api/smoke-api.spec.ts --project=chromium
        env:
          API_BASE_URL: ${{ vars.BACKEND_URL }}/api
          APP_BASE_URL: ${{ vars.FRONTEND_URL }}

      - name: Upload to Allure TestOps
        if: always()
        run: allurectl upload allure-results

      - name: Generate local Allure report (fallback)
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload local Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-local
          path: allure-report/

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
